<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiny Mint Settings</title>
  </head>
  <body>
    <main id="settings">
      <header>
        <p class="eyebrow">Tiny Mint</p>
        <h1>Settings</h1>
        <p class="intro">A few gentle controls for how he spends his time.</p>
      </header>
      <section aria-labelledby="general-heading">
        <h2 id="general-heading">General</h2>
        <label class="setting-row">
          <span><strong>Always on top</strong><small>Keep Tiny Mint above other windows.</small></span>
          <input type="checkbox" data-preference="alwaysOnTop" />
        </label>
        <label class="setting-row">
          <span><strong>Start with Windows</strong><small>Register sign-in startup for the packaged Windows app.</small></span>
          <input type="checkbox" data-preference="startWithWindows" />
        </label>
      </section>
      <section aria-labelledby="behavior-heading">
        <h2 id="behavior-heading">Behavior</h2>
        <label class="setting-row">
          <span><strong>Quiet mode</strong><small>No creature-initiated speech; manual Talk and room controls still work.</small></span>
          <input type="checkbox" data-preference="quietMode" />
        </label>
        <label class="setting-row">
          <span><strong>Roaming</strong><small>Let him wander around your desktop.</small></span>
          <input type="checkbox" data-preference="roamingEnabled" />
        </label>
        <label class="setting-row">
          <span><strong>Cursor play</strong><small>Look toward and reach for the pointer.</small></span>
          <input type="checkbox" data-preference="cursorInteraction" />
        </label>
        <label class="setting-row">
          <span><strong>Room visits</strong><small>Let him travel between the desktop and room.</small></span>
          <input type="checkbox" data-preference="roomVisitsEnabled" />
        </label>
        <label class="setting-row">
          <span><strong>Room autonomy</strong><small>Let him choose activities while at home.</small></span>
          <input type="checkbox" data-preference="roomAutonomyEnabled" />
        </label>
        <label class="setting-row">
          <span><strong>Creature-initiated interactions</strong><small>Let him occasionally start a quiet conversation.</small></span>
          <input type="checkbox" data-preference="interactionsEnabled" />
        </label>
      </section>
      <section aria-labelledby="data-heading">
        <h2 id="data-heading">Your Tiny Mint</h2>
        <p class="intro">Export local creature state and corkboard sketches as JSON. This excludes credentials and conversations.</p>
        <div class="dialogue-actions">
          <button id="export-state" type="button" class="secondary">Export Tiny Mint</button>
        </div>
        <p id="export-message" class="status" role="status" aria-live="polite"></p>
      </section>
      <section aria-labelledby="accessibility-heading">
        <h2 id="accessibility-heading">Accessibility</h2>
        <label class="setting-row">
          <span><strong>Reduced motion</strong><small>Freeze sprite animation while keeping his life running.</small></span>
          <input type="checkbox" data-preference="reducedMotion" />
        </label>
        <label class="setting-row">
          <span><strong>Pause Tiny Mint</strong><small>Pause autonomous decisions without hiding him.</small></span>
          <input type="checkbox" data-preference="paused" />
        </label>
      </section>
      <section aria-labelledby="controls-heading">
        <h2 id="controls-heading">Optional controls</h2>
        <label class="setting-row"><span><strong>Cursor nudges</strong><small>Allow occasional 24-pixel nudges near Tiny Mint. Stops when you move the mouse. No clicks. Escape cancels; Ctrl+Alt+Shift+M stops controls.</small></span><input type="checkbox" data-preference="cursorNudgesEnabled" /></label>
        <label class="setting-row"><span><strong>Spotify controls</strong><small>Let Tiny Mint play/pause or skip when you ask. Requires an active Windows media session.</small></span><input type="checkbox" data-preference="spotifyControlEnabled" /></label>
        <label class="setting-row"><span><strong>VLC controls</strong><small>Let Tiny Mint play/pause or skip when you ask. Requires an active Windows media session.</small></span><input type="checkbox" data-preference="vlcControlEnabled" /></label>
        <label class="setting-row"><span><strong>Autonomous bong breaks</strong><small>Allow rare room breaks, at most once per 30 minutes. Clicking the bong always starts a routine.</small></span><input type="checkbox" data-preference="bongAutonomyEnabled" /></label>
        <div class="dialogue-actions">
          <button data-desktop-action="cursor-nudge">Nudge cursor</button>
          <button data-desktop-action="spotify-play-pause">Spotify play/pause</button><button data-desktop-action="spotify-next">Spotify next</button>
          <button data-desktop-action="vlc-play-pause">VLC play/pause</button><button data-desktop-action="vlc-next">VLC next</button>
          <button id="stop-controls">Stop controls</button>
        </div>
        <p id="controls-status" class="status" role="status" aria-live="polite"></p>
      </section>
      <section aria-labelledby="privacy-heading">
        <h2 id="privacy-heading">Privacy</h2>
        <label class="setting-row">
          <span><strong>Basic awareness</strong><small>Notice active or away using only local system idle time. No screen, app, or input content is read.</small></span>
          <input id="basic-awareness" type="checkbox" />
        </label>
        <label class="setting-row">
          <span><strong>App awareness (Windows)</strong><small>Read along with coding or writing apps, draw with creative apps, relax with media, and hide during fullscreen apps. Reads only the foreground process name and window bounds locally. No titles or screen content; never saved or sent to AI.</small></span>
          <input id="desktop-awareness" type="checkbox" />
        </label>
        <label class="setting-row">
          <span><strong>Keyboard awareness (Windows)</strong><small>Settle down and defer automatic chatter while you type. Detects activity only, never which keys you press or what you type. Stays local and is never saved.</small></span>
          <input id="keyboard-awareness" type="checkbox" />
        </label>
        <p id="keyboard-awareness-message" class="status" role="status" aria-live="polite"></p>
        <p id="desktop-awareness-message" class="status" role="status" aria-live="polite"></p>
        <p id="awareness-message" class="status" role="status" aria-live="polite"></p>
      </section>
      <section aria-labelledby="dialogue-heading">
        <h2 id="dialogue-heading">Dialogue</h2>
        <p id="dialogue-status" class="dialogue-status" role="status" aria-live="polite">Checking…</p>
        <label class="key-field" for="groq-key">
          <span>API key</span>
          <input id="groq-key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste a new Groq key" />
        </label>
        <p id="key-state" class="key-state"></p>
        <div class="dialogue-actions">
          <button id="save-key" type="button">Save key</button>
          <button id="clear-key" type="button" class="secondary">Clear</button>
          <button id="test-connection" type="button" class="secondary">Test connection</button>
        </div>
        <p id="dialogue-message" class="status" role="status" aria-live="polite"></p>
      </section>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/ui/settings.ts"></script>
  </body>
</html>
